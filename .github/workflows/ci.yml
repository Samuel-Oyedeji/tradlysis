name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradlysis
          POSTGRES_PASSWORD: tradlysis
          POSTGRES_DB: tradlysis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradlysis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tradlysis:tradlysis@localhost:5432/tradlysis_test
      DATABASE_URL: postgresql://tradlysis:tradlysis@localhost:5432/tradlysis_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate Prisma schema and check migrations are up to date
        run: |
          npm ci --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          # Fails if schema.prisma has changes that no migration captures.
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
