<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tradlysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
.ov { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 16px; margin-top: 16px; }
.ov > .stack { gap: 16px; }
.ctl { display: grid; gap: 8px; }
.ctl .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.breakers { display: grid; gap: 6px; margin-top: 12px; font-size: 13px; }
.breakers div { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.event { padding: 10px 16px; border-bottom: 1px solid var(--grid); }
.event:last-child { border-bottom: 0; }
.event .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); }
.event .msg { font-size: 12px; color: var(--ink-2); overflow-wrap: break-word; }
.news-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--grid); font-size: 13px; }
.news-row:last-child { border-bottom: 0; }
.news-row .when { font: 12px var(--mono); color: var(--ink-2); }
/* Long lists (news, decisions, system events) show their first few items and scroll the rest. */
#news, #decisions, #events { overflow-y: auto; overscroll-behavior: contain; }
#decisions thead th { position: sticky; top: 0; z-index: 1; }
#open-trades .t th, #open-trades .t td { padding-left: 8px; padding-right: 8px; }
#open-trades .t th:first-child, #open-trades .t td:first-child { padding-left: 16px; }
#open-trades .t th:last-child, #open-trades .t td:last-child { padding-right: 16px; }
#news .sub { border-top: 1px solid var(--grid); background: var(--panel); }
svg#nav-chart { height: 260px; }
/* Tabbed panels (trades & decisions; experiments, news & events) show one list at a time. */
.tabbed .panel-h { padding-top: 0; padding-bottom: 0; flex-wrap: wrap; row-gap: 0; }
.tabbed .panel-h .seg { margin: 6px 0; }
.tabbed .panel-h .aside, .tabbed .panel-h .seg { margin-left: auto; }
.tabbed [hidden] { display: none; }
.ptabs { display: flex; gap: 2px; margin-bottom: -1px; overflow-x: auto; scrollbar-width: none; }
.ptabs button { font: 600 13px var(--sans); color: var(--ink-3); background: none; border: 0; border-bottom: 2px solid transparent; padding: 13px 10px 11px; cursor: pointer; white-space: nowrap; }
.ptabs button:first-child { margin-left: -10px; }
.ptabs button:hover { color: var(--ink-2); }
.ptabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.ptabs button:focus-visible { outline-offset: -2px; }
/* The side column is narrow: its tabs take the full width, labels wrap rather than get cut off. */
#p-info .ptabs { flex: 1 1 100%; margin-left: -8px; margin-right: -8px; }
#p-info .ptabs button { flex: 1 1 auto; line-height: 1.25; white-space: normal; padding-left: 4px; padding-right: 4px; }
#p-info .ptabs button:first-child { margin-left: 0; }
@media (max-width: 899px) {
  .ov { grid-template-columns: minmax(0, 1fr); }
  .ov > .stack { display: contents; }
  svg#nav-chart { height: 200px; }
  /* Phone order: most operational first. */
  #p-chart { order: 1; } #p-controls { order: 2; } #p-trades { order: 3; } #p-info { order: 4; }
  /* Decisions become a stacked list on phones: time · decision · confidence, reasons underneath. */
  #decisions table, #decisions tbody { display: block; }
  #decisions thead { display: none; }
  #decisions tr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 16px; border-bottom: 1px solid var(--grid); }
  #decisions td { padding: 0; border: 0; }
  #decisions td:nth-child(2) { display: none; }
  #decisions td:nth-child(5) { grid-column: 1 / -1; }
  /* The three tabs share the width on phones; labels wrap rather than get cut off. */
  .ptabs { flex: 1 1 100%; margin-left: -8px; margin-right: -8px; }
  .ptabs button { flex: 1 1 auto; font-size: 12.5px; line-height: 1.25; white-space: normal; padding-left: 2px; padding-right: 2px; }
  .ptabs button:first-child { margin-left: 0; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div>
    <header class="topbar" id="topbar"></header>
    <main class="main">
      <div class="page-h"><h1>Overview</h1><span class="muted" id="updated"></span></div>
      <div class="banner" id="banner" role="alert"></div>

      <section class="tiles" aria-label="Key figures">
        <div class="panel tile"><div class="label" title="The experiment's capital plus the P/L of its own trades">Experiment equity</div><div class="value" id="t-nav">–</div><div class="foot" id="t-nav-foot"></div></div>
        <div class="panel tile"><div class="label">Today</div><div class="value" id="t-day">–</div><div class="foot">since 17:00 New York</div></div>
        <div class="panel tile"><div class="label">Open trades</div><div class="value" id="t-open">–</div><div class="foot" id="t-open-foot"></div></div>
        <div class="panel tile"><div class="label" id="t-price-label">Price</div><div class="value" id="t-price">–</div><div class="foot" id="t-price-foot"></div></div>
      </section>

      <section class="panel" style="margin-top:16px" aria-labelledby="h-last">
        <div class="panel-h"><h2 id="h-last">Last decision</h2><span class="aside" id="last-link"></span></div>
        <div class="pipe" id="pipe"><div class="empty">Waiting for the first 15-minute cycle.</div></div>
      </section>

      <div class="ov">
        <div class="stack">
          <section class="panel" id="p-chart">
            <div class="panel-h"><h2 id="chart-title">Experiment equity · last 7 days</h2><button class="linkbtn" id="toggle-table" type="button">Show table</button></div>
            <div class="panel-b">
              <div class="chart-wrap" id="chart-wrap"><svg class="chart" id="nav-chart" role="img" aria-label="Experiment equity over the last 7 days"></svg><div class="tooltip" id="tooltip"></div></div>
              <div class="scroll-x" id="chart-table" style="display:none"></div>
            </div>
          </section>
          <section class="panel tabbed" id="p-trades">
            <div class="panel-h">
              <div class="ptabs" role="tablist" aria-label="Trades and decisions">
                <button type="button" role="tab" id="tab-open" aria-controls="open-trades" aria-selected="true">Open trades</button>
                <button type="button" role="tab" id="tab-decisions" aria-controls="decisions" aria-selected="false" tabindex="-1">Recent decisions</button>
                <button type="button" role="tab" id="tab-closed" aria-controls="closed-trades" aria-selected="false" tabindex="-1">Closed trades</button>
              </div>
              <a class="aside" href="/history" data-for="open-trades closed-trades">History →</a>
              <div class="seg" role="group" aria-label="Which decisions" data-for="decisions" hidden><button type="button" data-llm="0" aria-pressed="true">Every 15 min</button><button type="button" data-llm="1" aria-pressed="false">Model-reviewed</button></div>
            </div>
            <div class="panel-b flush scroll-x" id="open-trades" role="tabpanel" aria-labelledby="tab-open"></div>
            <div class="panel-b flush scroll-x" id="decisions" role="tabpanel" aria-labelledby="tab-decisions" hidden></div>
            <div class="panel-b flush scroll-x" id="closed-trades" role="tabpanel" aria-labelledby="tab-closed" hidden></div>
          </section>
        </div>

        <div class="stack">
          <section class="panel" id="p-controls">
            <div class="panel-h"><h2>Controls</h2></div>
            <div class="panel-b">
              <div class="ctl">
                <button id="btn-kill" class="btn danger block" type="button">Stop this experiment (kill switch)</button>
                <button id="btn-flatten" class="btn block" type="button">Close this experiment's trades</button>
                <div class="row2">
                  <button id="btn-reset-daily" class="btn" type="button">Reset daily limit</button>
                  <button id="btn-reset-dd" class="btn" type="button">Reset drawdown</button>
                </div>
              </div>
              <div class="breakers" id="breakers"></div>
              <details style="margin-top:12px"><summary>All experiments</summary>
                <div class="ctl" style="margin-top:8px">
                  <button id="btn-kill-all" class="btn block" type="button">Stop all experiments</button>
                  <button id="btn-flatten-all" class="btn block" type="button">Close every trade on the account</button>
                </div>
              </details>
            </div>
          </section>
          <section class="panel tabbed" id="p-info">
            <div class="panel-h">
              <div class="ptabs" role="tablist" aria-label="Experiments, news and system events">
                <button type="button" role="tab" id="tab-analysis" aria-controls="analysis-tab" aria-selected="true">Experiment results</button>
                <button type="button" role="tab" id="tab-news" aria-controls="news" aria-selected="false" tabindex="-1" id-news-label>News</button>
                <button type="button" role="tab" id="tab-events" aria-controls="events" aria-selected="false" tabindex="-1">System events</button>
              </div>
              <span class="aside" id="summary-when" data-for="analysis-tab"></span>
              <span class="aside" id="news-aside" data-for="news" hidden>next 48h</span>
              <div class="seg" role="group" aria-label="Event level" data-for="events" hidden><button type="button" data-lvl="WARNING" aria-pressed="true">Warnings</button><button type="button" data-lvl="INFO" aria-pressed="false">All</button></div>
            </div>
            <div id="analysis-tab" role="tabpanel" aria-labelledby="tab-analysis">
              <div class="panel-b" id="analysis"><span class="muted">No report yet. The analyzer writes one every hour.</span></div>
              <div class="panel-b" style="padding-top:0"><a class="btn block" href="/analysis">Experiment analysis →</a></div>
            </div>
            <div class="panel-b flush" id="news" role="tabpanel" aria-labelledby="tab-news" hidden></div>
            <div class="panel-b flush" id="events" role="tabpanel" aria-labelledby="tab-events" hidden></div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const {esc, fmt, dt, short, pretty, signed, codes, api} = T;
const $ = (id) => document.getElementById(id);
let onlyLlm = false, minLevel = "WARNING", accountSeries = [];
const OUTCOME_LABEL = {take_profit: "take-profit", stop_loss: "stop-loss", manual: "closed by you", bot_exit: "bot safety exit", margin_closeout: "margin close-out", unknown: "unknown"};
const NEWS_VISIBLE = 5, DECISIONS_VISIBLE = 10, EVENTS_VISIBLE = 5;

// Show the first `visible` items of a list panel; the rest scroll inside it. `keep` is the
// scroll position from before the re-render, so the 15 s refresh doesn't jump back to the top.
function capList(box, selector, visible, keep) {
  if (box.hidden) { box.style.maxHeight = ""; return box.querySelectorAll(selector).length; }  // measured when its tab opens
  const items = box.querySelectorAll(selector);
  if (items.length <= visible) { box.style.maxHeight = ""; return items.length; }
  const bottom = items[visible - 1].getBoundingClientRect().bottom;
  box.style.maxHeight = `${Math.ceil(bottom - box.getBoundingClientRect().top)}px`;
  box.scrollTop = keep;
  return items.length;
}
T.renderShell("overview");

async function refresh() {
  const [status, account, open, closed, decisions, events, news, analysis] = await Promise.all([
    T.refreshStatus(), api("/api/account?hours=168"), api("/api/trades?state=OPEN"), api("/api/trades?state=CLOSED&limit=12"),
    api(`/api/decisions?limit=25${onlyLlm ? "&only_llm=true" : ""}`), api(`/api/events?limit=20&min_level=${minLevel}`),
    api("/api/news"), api("/api/analysis/latest"),
  ].map(p => p.catch(e => ({__error: e.message}))));
  if (!status) { showBanner(["Could not reach the API. Check that the api service is running."]); return; }
  renderStatus(status, account); accountSeries = equitySeries(status, account); renderChart();
  renderOpen(open); renderClosed(closed); renderDecisions(decisions); renderEvents(events); renderNews(news);
  renderAnalysis(analysis.report); renderPipe(status);
  $("updated").textContent = `Updated ${new Date().toLocaleTimeString()}`;
}

function showBanner(lines) { $("banner").style.display = lines.length ? "block" : "none"; $("banner").textContent = lines.join(" "); }

function renderStatus(s, account) {
  const c = s.controls || {}, kill = c.kill_switch || {}, daily = c.daily_loss_breaker || {}, dd = c.drawdown_breaker || {};
  const globalKill = (c.global_kill_switch || {}).active, ownKill = (c.experiment_kill_switch || {}).active;
  const info = s.experiment_info || {};
  const lines = [];
  if (!s.engine_alive) lines.push("The trading engine hasn't reported for over a minute. Check the engine service.");
  else if (s.engine_state === "WAITING") lines.push(`The engine is not trading: ${s.engine_reason || "waiting for configuration"}.`);
  else if (!s.running) lines.push(info.enabled ? "This experiment starts when the engine has picked up the latest configuration." : "This experiment is switched off. Enable it on the Config page.");
  if (globalKill) lines.push(`All experiments are stopped by the kill switch${kill.reason ? ` (${kill.reason})` : ""}.`);
  else if (kill.active) lines.push(`This experiment is stopped by its kill switch${kill.reason ? ` (${kill.reason})` : ""}.`);
  if (daily.tripped) lines.push("Daily loss limit reached: no new trades until the next trading day.");
  if (dd.tripped) lines.push("Maximum drawdown reached: no new trades until you reset the drawdown limit.");
  showBanner(lines);
  $("btn-kill").textContent = ownKill ? "Resume this experiment" : "Stop this experiment (kill switch)";
  $("btn-kill").className = ownKill ? "btn primary block" : "btn danger block";
  $("btn-kill-all").textContent = globalKill ? "Resume all experiments" : "Stop all experiments";
  $("btn-kill-all").className = globalKill ? "btn primary block" : "btn block";
  const [base, quote] = String(info.instrument || "EUR_USD").split("_");
  document.querySelector("[id-news-label]").textContent = `News · ${base} & ${quote}`;
  const row = (label, bad, text) => `<div><span class="dim">${label}</span><span><span class="dot ${bad ? "d-bad" : "d-good"}"></span> ${text}</span></div>`;
  $("breakers").innerHTML = row("Kill switch", kill.active, globalKill ? "On (all)" : kill.active ? "On" : "Off") + row("Daily loss limit", daily.tripped, daily.tripped ? "Reached" : "OK") + row("Drawdown limit", dd.tripped, dd.tripped ? "Reached" : "OK");

  // The experiment's own equity (capital + P/L of its trades): live from the engine, else from the trades.
  const eng = s.engine || {}, acct = eng.account || (account && account.latest);
  const live = (s.experiment_status || {}).equity, stored = account && account.experiment;
  const eq = live ? {equity: Number(live.equity), balance: Number(live.balance), upl: Number(live.unrealized_pl), open: live.open_trades}
    : stored ? {equity: stored.equity, balance: stored.balance, upl: stored.unrealized_pl, open: null} : null;
  const ccy = acct ? acct.currency : "";
  if (eq) {
    $("t-nav").textContent = fmt(eq.equity);
    $("t-nav-foot").textContent = `${ccy} · balance ${fmt(eq.balance)}${acct ? ` · account ${fmt(Number(acct.nav))}` : ""}`;
    const dayStart = c.day_start_nav ? Number(c.day_start_nav.value) : null;
    $("t-day").innerHTML = dayStart ? signed((eq.equity - dayStart) / dayStart * 100, 2, "%") : "–";
    $("t-open").textContent = eq.open ?? "–"; $("t-open-foot").innerHTML = `unrealized ${signed(eq.upl)}`;
  } else {
    $("t-nav").textContent = "–"; $("t-nav-foot").textContent = "set when the engine first runs this experiment";
  }
  const m = s.market;
  $("t-price-label").textContent = T.pair(info.instrument || (m && m.instrument) || "");
  if (m) {
    $("t-price").textContent = m.bid ? fmt((m.bid + m.ask) / 2, 5) : "–";
    $("t-price-foot").textContent = m.market_open === false ? "market closed" : `spread ${fmt(m.spread_pips, 1)} pips · ${m.stream_connected ? "live" : "stream down"}`;
  }
}

// Signature: the path the latest 15-minute decision took.
function renderPipe(s) {
  const lc = (s.experiment_status || {}).last_cycle;
  if (!lc) { $("pipe").innerHTML = `<div class="empty">Waiting for the first 15-minute cycle.</div>`; $("last-link").innerHTML = ""; return; }
  const step = (key, mark, value, sub, off) => `<div class="pipe-step ${off ? "off" : ""}"><div class="k"><span class="mark m-${mark}">${{pass: "✓", fail: "✗", pend: "◷", info: "•", off: ""}[mark]}</span><span class="lbl">${key}</span></div><div class="v" data-k="${key}">${value}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const decided = lc.candle_time ? new Date(new Date(lc.candle_time).getTime() + 15 * 60000).toISOString() : null;
  const steps = [step("Candle", "info", esc(short(decided)), "15-minute close")];
  if (lc.note && lc.request_id == null) {
    steps.push(step("Setup", "off", "Skipped", esc(lc.note), true));
  } else {
    steps.push(step("Setup", lc.candidate ? "pass" : "fail", lc.candidate ? "Found" : "No setup", lc.candidate ? pretty((s.experiment_info || {}).strategy || "setup") : "rules not met"));
  }
  const tradeDecision = lc.decision === "BUY" || lc.decision === "SELL";
  if (!lc.llm_called) steps.push(step("Model", "off", "Not asked", lc.candidate ? "blocked before model" : "no setup to confirm", true));
  else steps.push(step("Model", tradeDecision ? "pass" : "fail", esc(lc.decision || "–"), lc.confidence != null ? `confidence ${fmt(lc.confidence)}` : ""));
  if (lc.approved == null) steps.push(step("Risk", "off", "Not reached", "", true));
  else steps.push(step("Risk", lc.approved ? "pass" : "fail", lc.approved ? "Approved" : "Rejected", lc.approved ? "" : codes((lc.rejections || []).slice(0, 2))));
  if (!lc.order_status) steps.push(step("Order", "off", "None", "", true));
  else steps.push(step("Order", lc.order_status === "FILLED" ? "pass" : ["REJECTED", "CANCELLED", "FAILED"].includes(lc.order_status) ? "fail" : "pend", esc(pretty(lc.order_status)), ""));
  $("pipe").innerHTML = steps.join("");
  $("last-link").innerHTML = lc.request_id ? `<a href="/history/r-${lc.request_id}">Open timeline →</a>` : "";
}

// The experiment's equity: its balance after each closed trade, then its live equity now.
// Without an experiment capital yet, the shared account's NAV.
function equitySeries(status, account) {
  const e = account && account.experiment;
  if (!e) { $("chart-title").textContent = "Account value · last 7 days"; return account.series || []; }
  $("chart-title").textContent = "Experiment equity · last 7 days";
  const live = (status.experiment_status || {}).equity;
  return [
    {t: e.start.t, nav: e.start.balance, balance: e.start.balance},
    ...(e.series || []).map(p => ({t: p.t, nav: p.balance, balance: p.balance})),
    {t: new Date().toISOString(), nav: live ? Number(live.equity) : e.equity, balance: e.balance},
  ];
}

// NAV chart: single series, hover crosshair + tooltip, table view.
function renderChart() {
  const svg = $("nav-chart"), series = accountSeries, W = svg.clientWidth || 700, H = svg.clientHeight || 260, P = {l: 60, r: 10, t: 10, b: 24};
  if (!series || series.length < 2) { svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="var(--ink-3)" font-size="13">Account history appears after the engine has run for a while.</text>`; renderChartTable(series || []); return; }
  const xs = series.map(p => new Date(p.t).getTime()), ys = series.map(p => p.nav);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.1 || Math.max(1, y1 * 0.001); y0 -= pad; y1 += pad;
  const X = t => P.l + (t - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3, y = Y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${P.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" font-family="var(--mono)" fill="var(--ink-3)">${fmt(v, 0)}</text>`; }
  g += `<text x="${P.l}" y="${H - 6}" font-size="11" fill="var(--ink-3)">${esc(dt(series[0].t))}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--ink-3)">${esc(dt(series[series.length - 1].t))}</text>`;
  const pts = series.map(p => ({x: X(new Date(p.t).getTime()), y: Y(p.nav), p}));
  g += `<path d="${pts.map((q, i) => `${i ? "L" : "M"}${q.x.toFixed(1)},${q.y.toFixed(1)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<line id="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" style="display:none"/><circle id="xd" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" style="display:none"/><rect id="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = g;
  const tip = $("tooltip"), hit = $("hit");
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let best = pts[0]; for (const q of pts) if (Math.abs(q.x - cx) < Math.abs(best.x - cx)) best = q;
    $("xh").setAttribute("x1", best.x); $("xh").setAttribute("x2", best.x); $("xh").style.display = ""; $("xd").setAttribute("cx", best.x); $("xd").setAttribute("cy", best.y); $("xd").style.display = "";
    tip.innerHTML = `<div class="muted">${esc(dt(best.p.t))}</div><b class="num">${fmt(best.p.nav)}</b>`; tip.style.display = "block";
    const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(best.x - tw / 2, 0), r.width - tw) + "px"; tip.style.top = "0px";
  };
  const leave = () => { tip.style.display = "none"; $("xh").style.display = "none"; $("xd").style.display = "none"; };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, {passive: true}); hit.addEventListener("touchmove", move, {passive: true});
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", leave);
  renderChartTable(series);
}
function renderChartTable(series) {
  const rows = series.slice(-60).reverse().map(p => `<tr><td>${esc(dt(p.t))}</td><td class="num">${fmt(p.nav)}</td><td class="num">${fmt(p.balance)}</td></tr>`).join("");
  $("chart-table").innerHTML = `<table class="t"><thead><tr><th>Time</th><th class="num">NAV</th><th class="num">Balance</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="muted">No data</td></tr>'}</tbody></table>`;
}
$("toggle-table").onclick = () => { const t = $("chart-table"), w = $("chart-wrap"), show = t.style.display === "none"; t.style.display = show ? "" : "none"; w.style.display = show ? "none" : ""; $("toggle-table").textContent = show ? "Show chart" : "Show table"; if (!show) renderChart(); };
window.addEventListener("resize", renderChart);

function renderOpen(trades) {
  if (!Array.isArray(trades) || !trades.length) { $("open-trades").innerHTML = `<div class="empty">No open trades.</div>`; return; }
  $("open-trades").innerHTML = `<table class="t"><thead><tr><th>Opened</th><th>Side</th><th class="num">Units</th><th class="num">Entry</th><th class="num" title="Stop-loss">Stop</th><th class="num" title="Take-profit">Target</th><th class="num" title="Where the trade stands now: in R, and unrealized P/L">Now</th><th class="num" title="Furthest the trade has gone for / against you, in R">Best / worst</th></tr></thead><tbody>${trades.map(t => { const x = t.excursion; return `<tr><td>${esc(short(t.open_time))}${t.unexpected ? ' <span class="pill"><span class="dot d-bad"></span>external</span>' : ""}</td><td>${esc(t.direction)}</td><td class="num">${Math.abs(t.current_units).toLocaleString()}</td><td class="num">${fmt(t.open_price, 5)}</td><td class="num">${fmt(t.stop_loss, 5)}</td><td class="num">${fmt(t.take_profit, 5)}</td><td class="num" style="white-space:nowrap">${x ? signed(x.result_r, 1, "R") : ""} <span class="muted">(${t.unrealized_pl == null ? "–" : (t.unrealized_pl > 0 ? "+" : "") + fmt(t.unrealized_pl)})</span></td><td class="num" style="white-space:nowrap">${x ? `${signed(x.best_r, 1)} / ${signed(-x.worst_r, 1)}<span class="muted">R</span>` : "–"}</td></tr>`; }).join("")}</tbody></table>`;
}
function renderClosed(trades) {
  if (!Array.isArray(trades) || !trades.length) { $("closed-trades").innerHTML = `<div class="empty">No closed trades yet.</div>`; return; }
  $("closed-trades").innerHTML = `<table class="t"><thead><tr><th>Closed</th><th>Side</th><th class="num">Entry</th><th class="num">Exit</th><th>How it ended</th><th class="num">R</th><th class="num" title="Furthest the trade went in your favour before closing">Best</th><th class="num">P/L</th></tr></thead><tbody>${trades.map(t => `<tr><td>${esc(short(t.close_time))}</td><td>${esc(t.direction)}</td><td class="num">${fmt(t.open_price, 5)}</td><td class="num">${fmt(t.close_price, 5)}</td><td>${esc(OUTCOME_LABEL[t.outcome] || pretty(t.close_reason))}</td><td class="num">${signed(t.r_multiple, 2, "R")}</td><td class="num">${t.excursion ? signed(t.excursion.best_r, 2, "R") : "–"}</td><td class="num">${signed(t.realized_pl)}</td></tr>`).join("")}</tbody></table>`;
}
function decisionCell(d) {
  if (d.decision === "BUY" || d.decision === "SELL") return `<b>${d.decision}</b> · ${d.risk_approved === true ? '<span class="good">approved</span>' : '<span class="bad">rejected</span>'}`;
  const why = {PREFILTER: "rules", LLM: "model", ERROR: "model error"}[d.source] || pretty(d.source);
  return `WAIT <span class="muted">· ${esc(why)}</span>`;
}
function renderDecisions(rows) {
  const box = $("decisions"), keep = box.scrollTop;
  box.style.maxHeight = "";
  if (!Array.isArray(rows) || !rows.length) { box.innerHTML = `<div class="empty">No decisions yet. The engine decides at every 15-minute close while the market is open.</div>`; return; }
  box.innerHTML = `<table class="t"><thead><tr><th>Candle</th><th>Setup</th><th>Decision</th><th class="num">Conf.</th><th>Why</th></tr></thead><tbody>${rows.map(d => {
    const clickable = d.candidate || d.llm_called;
    return `<tr ${clickable ? `class="click" data-href="/history/r-${d.id}" tabindex="0"` : ""}><td style="white-space:nowrap">${esc(short(d.candle_time))}</td><td>${d.candidate ? esc(d.direction) : '<span class="muted">–</span>'}</td><td style="white-space:nowrap">${decisionCell(d)}</td><td class="num">${d.confidence == null ? "–" : fmt(d.confidence)}</td><td class="codes">${codes([...(d.rejection_reasons || []), ...(d.reason_codes || [])].slice(0, 4)) || codes(d.failure_codes)}</td></tr>`;
  }).join("")}</tbody></table>`;
  document.querySelectorAll("#decisions tr[data-href]").forEach(tr => {
    tr.onclick = () => { location.href = tr.dataset.href; };
    tr.onkeydown = (e) => { if (e.key === "Enter") location.href = tr.dataset.href; };
  });
  capList(box, "tbody tr", DECISIONS_VISIBLE, keep);
}
function renderEvents(rows) {
  const box = $("events"), keep = box.scrollTop;
  box.style.maxHeight = "";
  if (!Array.isArray(rows) || !rows.length) { box.innerHTML = `<div class="empty">Nothing to report.</div>`; return; }
  const tone = {INFO: "d-off", WARNING: "d-warn", ERROR: "d-bad", CRITICAL: "d-bad"};
  box.innerHTML = rows.map(e => `<div class="event"><div class="top"><span><span class="dot ${tone[e.level]}"></span> ${esc(pretty(e.level))} · ${esc(e.component)}</span><span>${esc(short(e.created_at))}</span></div><div><b>${esc(pretty(e.event_type))}</b></div><div class="msg">${esc(e.message)}</div></div>`).join("");
  capList(box, ".event", EVENTS_VISIBLE, keep);
}
function renderNews(n) {
  if (!n || n.__error) { $("news").innerHTML = `<div class="empty">News unavailable.</div>`; return; }
  const ev = (n.events || []).map(e => `<div class="news-row"><div class="when">${esc(short(e.time))}</div><div><span class="dot ${e.impact === "HIGH" ? "d-bad" : "d-warn"}"></span> <b>${esc(e.currency)}</b> ${esc(e.title)} <span class="muted">· ${e.impact === "HIGH" ? "high" : "medium"} impact</span><div class="codes">forecast ${esc(e.forecast ?? "–")} · previous ${esc(e.previous ?? "–")}${e.actual ? " · actual " + esc(e.actual) : ""}</div></div></div>`).join("");
  const it = (n.interpretations || []).slice(0, 3).map(i => `<div class="news-row"><div class="when">${esc(i.currency)}</div><div><b>${esc(pretty(i.bias))}</b> <span class="muted">(${esc(pretty(i.tone))}, ${fmt(i.confidence)})</span><div class="codes">${esc(i.summary || "")}</div></div></div>`).join("");
  const box = $("news"), keep = box.scrollTop;
  box.style.maxHeight = "";
  box.innerHTML = (ev || `<div class="empty">No medium or high-impact events in the next 48 hours.</div>`) + (it ? `<div class="panel-h sub"><h2>Central-bank reads</h2></div>${it}` : "");
  const count = capList(box, ".news-row", NEWS_VISIBLE, keep);
  $("news-aside").textContent = count > NEWS_VISIBLE ? `${count} items · scroll` : "next 48h";
}
function renderAnalysis(r) {
  if (!r) { $("analysis").innerHTML = `<span class="muted">No report yet. The analyzer writes one every hour, or run it from Experiment analysis.</span>`; $("summary-when").textContent = ""; return; }
  const m = r.metrics, c = m.closed_trades || {};
  const top = Object.entries(m.rejection_reasons || {}).slice(0, 3).map(([k, v]) => `${pretty(k)} (${v})`).join(", ") || "–";
  const row = (k, v) => `<dt>${esc(k)}</dt><dd>${v}</dd>`;
  $("analysis").innerHTML = `<dl class="kv">
    ${row("Opportunities", `<span class="num">${m.opportunities}</span>`)}${row("Setups found", `<span class="num">${m.setup_candidates}</span>`)}
    ${row("Approved / checked", `<span class="num">${m.risk_approved} / ${m.risk_checks}</span>`)}${row("Closed trades", `<span class="num">${c.trades || 0}</span>`)}
    ${row("Win rate", c.win_rate == null ? "–" : `<span class="num">${fmt(c.win_rate * 100, 0)}%</span>`)}${row("Average R", c.avg_r == null ? "–" : signed(c.avg_r, 2, "R"))}
    ${row("Winner / loser", c.avg_winner_r == null && c.avg_loser_r == null ? "–" : `<span class="num">${fmt(c.avg_winner_r)}R / ${fmt(c.avg_loser_r)}R</span>`)}
    ${row("Max drawdown", `<span class="num">${c.max_drawdown_r == null ? "–" : fmt(c.max_drawdown_r) + "R"} · ${m.account_max_drawdown_pct == null ? "–" : fmt(m.account_max_drawdown_pct) + "%"}</span>`)}
    ${row("Slippage", m.execution?.avg_slippage_pips == null ? "–" : `<span class="num">${fmt(m.execution.avg_slippage_pips)} pips</span>`)}
    ${row("Top rejections", esc(top))}
  </dl>`;
  $("summary-when").textContent = short(r.created_at);
}

async function control(path, body, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try { await api(path, {method: "POST", body: JSON.stringify(body || {})}); await refresh(); } catch (e) { alert(`That didn't go through: ${e.message}`); }
}
function killSwitch(experiment, active) {
  const scope = experiment ? "this experiment" : "all experiments";
  const reason = active ? prompt(`Why are you stopping ${scope}? (shown in the log)`, "manual stop") : "";
  if (reason === null) return;
  control("/api/controls/kill-switch", {active, reason, experiment}, active ? null : `Resume ${scope}? New trades will be allowed again.`);
}
$("btn-kill").onclick = () => killSwitch(T.experiment, !(T.status?.controls?.experiment_kill_switch?.active));
$("btn-kill-all").onclick = () => killSwitch(null, !(T.status?.controls?.global_kill_switch?.active));
$("btn-flatten").onclick = () => control("/api/controls/flatten", {reason: "dashboard", experiment: T.experiment}, "Close this experiment's open trades at market price? The engine does this within a few seconds.");
$("btn-flatten-all").onclick = () => control("/api/controls/flatten", {reason: "dashboard (all)"}, "Close EVERY open trade on the account, for all experiments, at market price?");
$("btn-reset-daily").onclick = () => control("/api/controls/reset-breaker/daily", {}, "Reset this experiment's daily loss limit? Today's loss will be measured from its current equity.");
$("btn-reset-dd").onclick = () => control("/api/controls/reset-breaker/drawdown", {}, "Reset this experiment's drawdown limit? Drawdown will be measured from its current equity.");
document.querySelectorAll("#p-trades .seg button").forEach(b => b.onclick = () => { onlyLlm = b.dataset.llm === "1"; document.querySelectorAll("#p-trades .seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); refresh(); });
document.querySelectorAll("#p-info .seg button").forEach(b => b.onclick = () => { minLevel = b.dataset.lvl; document.querySelectorAll("#p-info .seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); refresh(); });
// Tabbed panels: show one list at a time, plus the header extras (data-for) that belong to it.
// Capped lists can't be measured while hidden, so they are capped when their tab opens.
const TAB_CAPS = {decisions: ["tbody tr", DECISIONS_VISIBLE], news: [".news-row", NEWS_VISIBLE], events: [".event", EVENTS_VISIBLE]};
document.querySelectorAll(".tabbed").forEach(panel => {
  const tabs = [...panel.querySelectorAll("[role=tab]")];
  const select = (tab) => {
    tabs.forEach(t => { const on = t === tab; t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1; $(t.getAttribute("aria-controls")).hidden = !on; });
    const id = tab.getAttribute("aria-controls");
    panel.querySelectorAll("[data-for]").forEach(el => { el.hidden = !el.dataset.for.split(" ").includes(id); });
    if (TAB_CAPS[id]) capList($(id), ...TAB_CAPS[id], $(id).scrollTop);
  };
  tabs.forEach((t, i) => {
    t.onclick = () => select(t);
    t.onkeydown = (e) => {
      const step = {ArrowRight: 1, ArrowLeft: -1}[e.key];
      if (!step) return;
      const next = tabs[(i + step + tabs.length) % tabs.length];
      select(next); next.focus(); e.preventDefault();
    };
  });
});
refresh(); setInterval(refresh, 15000);
</script>
