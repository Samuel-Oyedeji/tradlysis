<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Trade History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: -6px 0 16px; }
.stat b { font: 600 18px var(--mono); display: block; }
.stat > span { font-size: 12px; color: var(--ink-3); }
.split { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
.listpane { position: sticky; top: 24px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; overflow: hidden; }
.listpane .panel-h { flex: none; }
.list { overflow-y: auto; flex: 1; }
.day { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; padding: 12px 16px 4px; background: var(--panel); position: sticky; top: 0; z-index: 1; }
.item { display: block; color: inherit; text-decoration: none; padding: 10px 16px 10px 13px; border-left: 3px solid transparent; border-bottom: 1px solid var(--grid); }
.item:hover { background: var(--panel-2); text-decoration: none; }
.item[aria-current="true"] { background: var(--panel-2); border-left-color: var(--accent); }
.item .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item .r1 .when { font: 500 13px var(--mono); }
.item .meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; overflow-wrap: break-word; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.hypo { font-size: 12px; margin-top: 3px; }
.more { padding: 12px 16px; }
.detail-empty { padding: 48px 24px; text-align: center; color: var(--ink-3); }
.dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.dh h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.dh .sub { color: var(--ink-3); font-size: 13px; }
.dh .res { text-align: right; }
.dh .res .badge { font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin-bottom: 16px; }
.facts > div { padding: 12px 14px; min-width: 0; }
.facts > div + div { border-left: 1px solid var(--grid); }
.facts .label { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.facts .value { font: 600 15px var(--mono); margin-top: 3px; overflow-wrap: anywhere; }
svg#pchart { height: 280px; }
/* timeline tree */
.tree { list-style: none; margin: 0; padding: 0; }
.tree > li { position: relative; padding: 0 0 20px 36px; }
.tree > li:last-child { padding-bottom: 0; }
.tree > li::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 2px; width: 2px; background: var(--grid); }
.tree > li:last-child::before { display: none; }
.tree > li.dash::before { background: repeating-linear-gradient(var(--line) 0 4px, transparent 4px 8px); }
.tree .mark { position: absolute; left: 0; top: 0; width: 24px; height: 24px; font-size: 12px; }
.nhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.ntitle { font-weight: 600; font-size: 15px; }
.ntime { font: 12px var(--mono); color: var(--ink-3); }
.nsum { color: var(--ink-2); overflow-wrap: break-word; margin-top: 1px; }
.stop { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--bad-ink); border: 1px solid var(--bad); border-radius: 999px; padding: 1px 9px; }
.nbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 28px; margin-top: 8px; }
.nbody.one { grid-template-columns: minmax(0, 1fr); }
.children { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 2px solid var(--grid); }
.children li { position: relative; padding: 3px 0 3px 14px; font-size: 13px; }
.children li::before { content: ""; position: absolute; left: -2px; top: 13px; width: 10px; border-top: 2px solid var(--grid); }
.children .ci { font-weight: 700; margin-right: 4px; }
.children .cd { color: var(--ink-3); overflow-wrap: break-word; }
/* experiment cards: one row, scrolls sideways when there are more than fit */
:root { --x0: #8b6cf0; --x1: #1fa5b3; --x2: #e67a2e; --x3: #d6498f; --x4: #4d7fff; --x5: #9aa31c; --x6: #c05d3c; --x7: #7d8aa5; }
.xstrip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(176px, 1fr); gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scroll-padding: 0 2px; margin: 0 0 16px; padding: 2px 2px 6px; scrollbar-width: thin; }
.xstrip:empty { display: none; }
.xcard { position: relative; display: block; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px 10px 16px; min-width: 0; overflow: hidden; scroll-snap-align: start; box-shadow: var(--shadow); }
.xcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--ink-3)); }
.xcard.all::before { background: linear-gradient(var(--x0) 0 20%, var(--x1) 20% 40%, var(--x2) 40% 60%, var(--x3) 60% 80%, var(--x4) 80%); }
.xcard:hover { background: var(--panel-2); }
.xcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.xcard > span { display: block; }
.xcard .xn { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.xcard .xn > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.xcard .off { font: 600 10px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
.xcard .xs { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xcard .xrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 8px; }
.xcard .xr { display: block; font: 600 17px/1 var(--mono); }
.xcard .xm { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 6px; white-space: nowrap; }
.xcard svg { width: 56px; height: 24px; flex: none; }
.xtag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.xtag i { width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--ink-3)); flex: none; }
.item .meta .xtag { margin-right: 6px; }
.item.x:not([aria-current="true"]) { box-shadow: inset 3px 0 0 var(--c, var(--ink-3)); }
.dh .xtag { font-size: 13px; margin-top: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; }
.kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--ink-2); }
@media (max-width: 1280px) { .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } .facts > div:nth-child(4) { border-left: 0; } .facts > div:nth-child(n+4) { border-top: 1px solid var(--grid); } .nbody { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 899px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .listpane { position: static; max-height: none; }
  body.detail .listpane, body.detail .stats, body.detail .xstrip { display: none; }
  .xstrip { grid-auto-columns: 172px; margin-right: -16px; padding-right: 16px; }
  body:not(.detail) .detailpane { display: none; }
  svg#pchart { height: 220px; }
  .dh .res { text-align: left; }
  .keys { display: none; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div>
    <header class="topbar" id="topbar"></header>
    <main class="main">
      <div class="page-h"><h1>History</h1><span class="muted keys">Use <span class="kbd">↑</span> <span class="kbd">↓</span> for items, <span class="kbd">[</span> <span class="kbd">]</span> for experiments</span></div>
      <div class="xstrip" id="xstrip" role="group" aria-label="Experiment"></div>
      <div class="stats" id="stats"></div>
      <div class="split">
        <section class="panel listpane" aria-label="Trades and stopped setups">
          <div class="panel-h">
            <div class="seg" role="group" aria-label="Filter">
              <button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="traded" aria-pressed="false">Taken</button><button type="button" data-f="stopped" aria-pressed="false">Stopped</button>
            </div>
            <span class="aside" id="count"></span>
          </div>
          <div class="list" id="list"><div class="empty">Loading…</div></div>
        </section>
        <section class="detailpane" id="detail" aria-live="polite"></section>
      </div>
    </main>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
const {esc, fmt, dt, tm, day, pretty, api} = T;
const $ = (id) => document.getElementById(id);
const isDesktop = () => window.matchMedia("(min-width: 900px)").matches;
T.renderShell("history"); T.refreshStatus(); setInterval(T.refreshStatus, 30000);

// ?show=<slug> shows one experiment; without it, every experiment in one list. (Not ?experiment=,
// which app.js treats as the account-wide pick and would reject "all".)
const urlShow = () => new URLSearchParams(location.search).get("show") || "all";
let state = {filter: "all", offset: 0, items: [], total: 0, selected: null, show: urlShow(), experiments: [], overall: null};
const pathId = () => { const m = location.pathname.match(/^\/history\/([^/]+)$/); return m ? decodeURIComponent(m[1]) : null; };
const qs = () => state.show === "all" ? "" : `?show=${encodeURIComponent(state.show)}`;

// Experiments: colour (by position in the config) + name, always shown together.
const expOf = (slug) => state.experiments.find(e => e.slug === slug);
const xcolor = (slug) => { const e = expOf(slug); return e ? `var(--x${e.color % 8})` : "var(--ink-3)"; };
const xtag = (slug, extra = "") => `<span class="xtag" style="--c:${xcolor(slug)}"><i></i>${esc(expOf(slug)?.name || slug || "No experiment")}${extra}</span>`;
const rText = (r, d = 1) => r == null ? `<span class="muted">–</span>` : `<span class="${r >= 0 ? "good" : "bad"}">${r > 0 ? "+" : ""}${fmt(r, d)}R</span>`;
function spark(curve) {
  if (!curve || curve.length < 2) return "";
  const W = 56, H = 24, lo = Math.min(...curve), hi = Math.max(...curve), y = v => 2 + (1 - (v - lo) / (hi - lo || 1)) * (H - 4);
  const pts = curve.map((v, i) => `${(2 + i / (curve.length - 1) * (W - 4)).toFixed(1)},${y(v).toFixed(1)}`).join(" "), last = curve[curve.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="2" x2="${W - 2}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="2 2"/><polyline points="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${W - 2}" cy="${y(last)}" r="2.5" fill="${last >= 0 ? "var(--good)" : "var(--bad)"}"/></svg>`;
}
function card(slug, name, sub, s, extra = "") {
  const meta = s.taken ? `<span class="good">${s.won}W</span> · <span class="bad">${s.lost}L</span>${s.open ? ` · <span class="warn">${s.open} open</span>` : ""}` : "no trades yet";
  const label = `${name}: ${s.net_r == null ? "no closed trades" : `${s.net_r > 0 ? "+" : ""}${fmt(s.net_r, 1)}R`}, ${s.won} won, ${s.lost} lost, ${s.open} open`;
  return `<button type="button" class="xcard ${slug === "all" ? "all" : ""}" data-x="${esc(slug)}" aria-pressed="${state.show === slug}" aria-label="${esc(label)}" style="--c:${xcolor(slug)}">
    <span class="xn"><span>${esc(name)}</span>${extra}</span><span class="xs">${esc(sub)}</span>
    <span class="xrow"><span><span class="xr">${rText(s.net_r)}</span><span class="xm">${meta}</span></span>${spark(s.curve)}</span></button>`;
}
function renderStrip() {
  const el = $("xstrip"), left = el.scrollLeft, exps = state.experiments;
  el.innerHTML = card("all", "All experiments", `${exps.filter(e => e.enabled).length} on · ${exps.length} total`, state.overall)
    + exps.map(e => card(e.slug, e.name, `${T.pair(e.instrument)} · ${pretty(e.strategy)}`, e.summary, e.enabled ? "" : `<span class="off">off</span>`)).join("");
  el.scrollLeft = left;
  el.querySelectorAll(".xcard").forEach(b => b.onclick = () => showExperiment(b.dataset.x));
}
async function showExperiment(slug, push = true) {
  if (slug === state.show && push) return;
  state.show = slug;
  if (slug !== "all") T.rememberExperiment(slug);
  if (push) history.pushState({}, "", `/history${qs()}`);
  $("xstrip").querySelectorAll(".xcard").forEach(b => b.setAttribute("aria-pressed", b.dataset.x === slug));
  $("xstrip").querySelector(`.xcard[aria-pressed="true"]`)?.scrollIntoView({block: "nearest", inline: "nearest"});
  await loadList(true);
  if (isDesktop() && state.items.length) select(state.items[0].id, false, true);
  else select(null, false);
}

// Outcome -> [css class, icon]; icon + words so meaning never relies on colour alone.
function tone(it) {
  const o = it.outcome;
  if (o === "WON") return ["good", "▲"];
  if (o === "LOST") return ["bad", "▼"];
  if (o === "OPEN" || o === "ORDER_PENDING" || o === "FILLED_AWAITING_SYNC" || o === "EXTERNAL") return ["warn", "◷"];
  if (it.category === "STOPPED") return ["dim", "■"];
  return ["dim", "•"];
}
function hypoLine(h) {
  if (!h) return "";
  const cls = h.result === "WOULD_WIN" ? "good" : h.result === "WOULD_LOSE" ? "bad" : "muted";
  const icon = h.result === "WOULD_WIN" ? "▲" : h.result === "WOULD_LOSE" ? "▼" : "…";
  return `<div class="hypo ${cls}">↳ ${icon} ${esc(h.label)}</div>`;
}

// ------------------------------------------------------------------ list
async function loadList(reset = true) {
  if (reset) { state.offset = 0; state.items = []; }
  let data;
  try { data = await api(`/api/history?experiment=${encodeURIComponent(state.show)}&filter=${state.filter}&limit=50&offset=${state.offset}`); }
  catch (e) {
    if (e.status === 404 && state.show !== "all") return showExperiment("all");  // experiment deleted or renamed
    $("list").innerHTML = `<div class="empty bad">Couldn't load history: ${esc(e.message)}</div>`; return;
  }
  state.items = state.items.concat(data.items); state.total = data.total;
  state.experiments = data.experiments; state.overall = data.overall;
  renderStrip();
  const s = data.summary;
  const stat = (v, label) => `<div class="stat"><b>${v}</b><span>${label}</span></div>`;
  $("stats").innerHTML = stat(s.taken, "trades taken") + stat(`<span class="good">${s.won}</span> / <span class="bad">${s.lost}</span>`, "won / lost")
    + stat(s.open, "open") + stat(rText(s.net_r, 2), state.show === "all" ? "net R, all experiments" : "net R") + stat(s.stopped, "setups stopped")
    + stat(`<span class="good">▲ ${s.stopped_would_win}</span> <span class="bad">▼ ${s.stopped_would_lose}</span>`, "stopped setups: would have won / lost");
  $("count").textContent = `${state.total} item${state.total === 1 ? "" : "s"}`;
  renderList();
}

function renderList() {
  if (!state.items.length) {
    const msg = {all: "No trades or setups yet. They appear here as soon as the engine finds a setup.", traded: "No trades taken yet.", stopped: "No stopped setups yet."}[state.filter]
      .replace(/\.$/, state.show === "all" ? "." : ` for ${expOf(state.show)?.name || state.show}.`);
    $("list").innerHTML = `<div class="empty">${msg}</div>`; return;
  }
  let html = "", lastDay = null;
  for (const it of state.items) {
    const d = day(it.time);
    if (d !== lastDay) { html += `<div class="day">${esc(d)}</div>`; lastDay = d; }
    const [cls, icon] = tone(it);
    const detail = it.category === "TRADED"
      ? [it.r_multiple != null ? `${it.r_multiple > 0 ? "+" : ""}${fmt(it.r_multiple)}R` : null, it.pl != null ? `P/L ${fmt(it.pl)}` : null, it.confidence != null ? `confidence ${fmt(it.confidence)}` : null].filter(Boolean).join(" · ")
      : (it.reasons || []).map(pretty).join(", ");
    const all = state.show === "all";
    html += `<a class="item ${all ? "x" : ""}" style="--c:${xcolor(it.experiment)}" href="/history/${esc(it.id)}${qs()}" data-id="${esc(it.id)}" ${it.id === state.selected ? 'aria-current="true"' : ""}>
      <div class="r1"><span class="when">${esc(tm(it.time))} · ${esc(it.direction || "–")}</span><span class="badge ${cls}">${icon} ${esc(it.label)}</span></div>
      ${detail || all ? `<div class="meta">${all ? xtag(it.experiment) : ""}${esc(detail)}</div>` : ""}
      ${hypoLine(it.hypothetical)}</a>`;
  }
  if (state.items.length < state.total) html += `<div class="more"><button class="btn block" id="more" type="button">Load more (${state.total - state.items.length})</button></div>`;
  $("list").innerHTML = html;
  $("list").querySelectorAll("a.item").forEach(a => a.onclick = (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    e.preventDefault(); select(a.dataset.id, true);
  });
  const more = $("more"); if (more) more.onclick = () => { state.offset += 50; loadList(false); };
}

function markActive() {
  $("list").querySelectorAll("a.item").forEach(a => a.setAttribute("aria-current", a.dataset.id === state.selected ? "true" : "false"));
  const cur = $("list").querySelector('a.item[aria-current="true"]');
  if (cur && isDesktop()) cur.scrollIntoView({block: "nearest"});
}

async function select(id, push, replace = false) {
  state.selected = id;
  if (push) history.pushState({id}, "", `${id ? `/history/${id}` : "/history"}${qs()}`);
  else if (replace) history.replaceState({id}, "", `${id ? `/history/${id}` : "/history"}${qs()}`);
  document.body.classList.toggle("detail", !!id);
  markActive();
  if (!id) { $("detail").innerHTML = `<div class="panel detail-empty">Select a trade or stopped setup to see its timeline.</div>`; return; }
  $("detail").innerHTML = `<div class="panel detail-empty">Loading…</div>`;
  await renderDetail(id);
  if (!isDesktop()) window.scrollTo(0, 0);
}

window.addEventListener("popstate", async () => {
  if (urlShow() !== state.show) {
    state.show = urlShow(); await loadList(true);
    $("xstrip").querySelector(`.xcard[aria-pressed="true"]`)?.scrollIntoView({block: "nearest", inline: "nearest"});
  }
  select(pathId(), false);
});
document.querySelectorAll(".seg button[data-f]").forEach(b => b.onclick = async () => {
  state.filter = b.dataset.f; document.querySelectorAll(".seg button[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  await loadList(true);
  if (isDesktop() && state.items.length && !state.items.some(i => i.id === state.selected)) select(state.items[0].id, true);
});
// [ and ] step through the experiment cards.
document.addEventListener("keydown", (e) => {
  if (!["[", "]"].includes(e.key) || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  const order = ["all", ...state.experiments.map(x => x.slug)], i = order.indexOf(state.show);
  const next = order[Math.min(Math.max(i + (e.key === "]" ? 1 : -1), 0), order.length - 1)];
  if (next !== state.show) { e.preventDefault(); showExperiment(next); }
});
document.addEventListener("keydown", (e) => {
  if (!isDesktop() || ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  const keys = {ArrowDown: 1, j: 1, ArrowUp: -1, k: -1};
  if (!(e.key in keys) || !state.items.length) return;
  e.preventDefault();
  const i = state.items.findIndex(x => x.id === state.selected);
  const next = state.items[Math.min(Math.max(i + keys[e.key], 0), state.items.length - 1)];
  if (next && next.id !== state.selected) select(next.id, true);
});

// ------------------------------------------------------------------ detail
const MARK = {pass: ["pass", "✓"], fail: ["fail", "✗"], info: ["info", "•"], pending: ["pend", "◷"], warn: ["pend", "!"], win: ["pass", "▲"], loss: ["fail", "▼"]};

function childList(children) {
  if (!children.length) return "";
  const rows = (list) => `<ul class="children">${list.map(c => `<li><span class="ci ${c.status === "pass" ? "good" : c.status === "fail" ? "bad" : "muted"}">${(MARK[c.status] || MARK.info)[1]}</span>${esc(c.title)} <span class="cd">${esc(c.summary)}</span></li>`).join("")}</ul>`;
  if (children.length <= 8) return rows(children);
  const failed = children.filter(c => c.status === "fail");
  return `${failed.length ? rows(failed) : `<div class="muted" style="font-size:13px">All ${children.length} passed.</div>`}<details><summary>Show all ${children.length}</summary>${rows(children)}</details>`;
}

function nodeHtml(n) {
  const [mcls, icon] = MARK[n.status] || MARK.info;
  const kv = n.details.length ? `<dl class="kv">${n.details.map(d => `<dt>${esc(d.label)}</dt><dd>${esc(d.value)}</dd>`).join("")}</dl>` : "";
  const kids = childList(n.children);
  const body = kv || kids ? `<div class="nbody ${kv && kids ? "" : "one"}">${kv ? `<div>${kv}</div>` : ""}${kids ? `<div>${kids}</div>` : ""}</div>` : "";
  const raw = n.raw ? `<details><summary>Raw data</summary><div class="raw">${esc(JSON.stringify(n.raw, null, 2))}</div></details>` : "";
  return `<li class="${n.stopped_here ? "dash" : ""}"><span class="mark m-${mcls}" aria-hidden="true">${icon}</span>
    <div class="nhead"><span class="ntitle">${esc(n.title)} <span class="sr">(${esc(n.status)})</span></span>${n.time ? `<span class="ntime">${esc(dt(n.time))}</span>` : ""}</div>
    ${n.summary ? `<div class="nsum">${esc(n.summary)}</div>` : ""}
    ${n.stopped_here ? `<span class="stop">■ Stopped here</span>` : ""}${body}${raw}</li>`;
}

async function renderDetail(id) {
  let d;
  try { d = await api(`/api/history/${encodeURIComponent(id)}`); }
  catch (e) { $("detail").innerHTML = `<div class="panel detail-empty">${String(e.message).startsWith("404") ? "This item doesn't exist." : esc(e.message)}</div>`; return; }
  if (state.selected !== id) return; // user moved on while loading
  const it = d.item, [cls, icon] = tone(it), L = d.levels;
  const decisionNode = d.timeline.find(n => n.key === "decision");
  const resultValue = it.category === "TRADED"
    ? (it.r_multiple != null ? `<span class="${it.r_multiple >= 0 ? "good" : "bad"}">${it.r_multiple > 0 ? "+" : ""}${fmt(it.r_multiple)}R</span>` : esc(it.label))
    : (it.hypothetical ? `<span class="${it.hypothetical.result === "WOULD_WIN" ? "good" : it.hypothetical.result === "WOULD_LOSE" ? "bad" : "muted"}">${it.hypothetical.r != null ? `${it.hypothetical.r > 0 ? "+" : ""}${fmt(it.hypothetical.r)}R*` : "–"}</span>` : "–");
  const fact = (label, value) => `<div><div class="label">${label}</div><div class="value">${value}</div></div>`;
  $("detail").innerHTML = `
    <div class="dh">
      <div>${isDesktop() ? "" : `<a href="/history${qs()}" id="back">← All history</a>`}
        <h2>${esc(it.direction || "")} ${esc(T.pair(it.instrument))}</h2><div class="sub">${esc(dt(it.time))}${it.regime ? ` · ${esc(pretty(it.regime))}` : ""}${it.news_risk ? ` · news ${esc(it.news_risk)}` : ""}</div>
        ${xtag(it.experiment, expOf(it.experiment) ? ` · ${esc(pretty(expOf(it.experiment).strategy))}` : "")}</div>
      <div class="res"><span class="badge ${cls}">${icon} ${esc(it.label)}</span>${hypoLine(it.hypothetical)}</div>
    </div>
    <div class="panel facts">
      ${fact("Entry", fmt(L.entry, 5))}${fact("Stop-loss", fmt(L.stop_loss, 5))}${fact("Take-profit", fmt(L.take_profit, 5))}
      ${fact("Risk:reward", it.risk_reward ? `1:${esc(it.risk_reward)}` : "–")}${fact("Confidence", it.confidence != null ? fmt(it.confidence) : (decisionNode ? "–" : "n/a"))}
      ${fact(it.category === "TRADED" ? "Result" : "Would have", resultValue)}
    </div>
    <section class="panel" style="margin-bottom:16px">
      <div class="panel-h"><h2>Price · 15-minute bars <span class="aside" style="font-weight:400">· line: close, bars: high–low</span></h2><button class="linkbtn" id="tbl" type="button">Show table</button></div>
      <div class="panel-b"><div class="chart-wrap" id="cw"><svg class="chart" id="pchart" role="img" aria-label="Price path with entry, stop-loss and take-profit levels"></svg><div class="tooltip" id="tip"></div></div><div class="scroll-x" id="ctable" style="display:none"></div></div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Timeline</h2><span class="aside">${it.category === "STOPPED" ? "stopped setups end where they were blocked" : ""}</span></div>
      <div class="panel-b"><ol class="tree">${d.timeline.map(nodeHtml).join("")}</ol></div>
    </section>
    ${it.category === "STOPPED" && it.hypothetical ? `<p class="muted" style="font-size:12px">* Estimated from 15-minute mid-price candles after the decision; ignores spread and slippage.</p>` : ""}`;
  const back = $("back"); if (back) back.onclick = (e) => { e.preventDefault(); select(null, true); };
  drawChart(d); window.onresize = () => drawChart(d);
  $("tbl").onclick = () => {
    const tb = $("ctable"), cw = $("cw"), show = tb.style.display === "none";
    tb.style.display = show ? "" : "none"; cw.style.display = show ? "none" : ""; $("tbl").textContent = show ? "Show chart" : "Show table";
    if (show) tb.innerHTML = `<table class="t"><thead><tr><th>Time</th><th class="num">High</th><th class="num">Low</th><th class="num">Close</th></tr></thead><tbody>${d.price_path.map(b => `<tr><td>${esc(dt(b.t))}</td><td class="num">${fmt(b.h, 5)}</td><td class="num">${fmt(b.l, 5)}</td><td class="num">${fmt(b.c, 5)}</td></tr>`).join("")}</tbody></table>`;
    else drawChart(d);
  };
}

function drawChart(d) {
  const svg = $("pchart"); if (!svg) return;
  const pts = d.price_path, W = svg.clientWidth || 700, H = svg.clientHeight || 280, P = {l: 8, r: 84, t: 18, b: 24};
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (pts.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" fill="var(--ink-3)" font-size="13">No candle data for this period yet.</text>`; return; }
  const L = d.levels, xs = pts.map(p => new Date(p.t).getTime());
  const vals = pts.flatMap(p => [p.h, p.l]).concat([L.entry, L.stop_loss, L.take_profit, L.exit].filter(v => v != null));
  let y0 = Math.min(...vals), y1 = Math.max(...vals); const pad = (y1 - y0) * 0.08 || 0.0005; y0 -= pad; y1 += pad;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const X = t => P.l + (t - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  let g = "";
  const ref = (v, label, color, dash) => { if (v == null) return; const y = Y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="1.5" ${dash ? 'stroke-dasharray="5 4"' : ""}/><text x="${W - P.r + 6}" y="${y + 4}" font-size="11" font-family="var(--mono)" fill="var(--ink-2)">${label}</text>`; };
  ref(L.take_profit, `TP ${fmt(L.take_profit, 5)}`, "var(--good)", true);
  ref(L.stop_loss, `SL ${fmt(L.stop_loss, 5)}`, "var(--bad)", true);
  ref(L.entry, `In ${fmt(L.entry, 5)}`, "var(--ink-3)", false);
  const M = d.markers;
  const marks = [[M.decision, "decision"], [M.open, "open"], [M.close, "close"], [M.hypothetical_resolved, "hit"]]
    .filter(([iso]) => iso).map(([iso, label]) => [X(new Date(iso).getTime()), label, new Date(iso).getTime()])
    .filter(([, , t]) => t >= x0 && t <= x1).sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const [x, label] of marks) { const last = merged[merged.length - 1]; if (last && x - last[0] < 48) last[1] += " / " + label; else merged.push([x, label]); }
  for (const [x, label] of merged) {
    const anchor = x > W - P.r - 70 ? "end" : "start";
    g += `<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" stroke-dasharray="2 3"/><text x="${anchor === "end" ? x - 4 : x + 4}" y="${P.t - 5}" text-anchor="${anchor}" font-size="11" fill="var(--ink-3)">${esc(label)}</text>`;
  }
  // High-low wick per bar, behind the close line. Between the decision (or fill) and the bar that settled the
  // outcome, a wick that reaches the stop or target is coloured, so a stop run inside a bar shows even when no
  // close crossed the level.
  const long = L.stop_loss != null && L.take_profit != null ? L.take_profit > L.stop_loss : null;
  const from = M.decision || M.open ? new Date(M.decision || M.open).getTime() : Infinity;
  const end = M.close || M.hypothetical_resolved, until = end ? new Date(end).getTime() : Infinity;
  const ww = Math.max(1, Math.min(4, (W - P.l - P.r) / pts.length * 0.45));
  g += pts.map((p, i) => {
    const live = long != null && xs[i] >= from && xs[i] <= until;
    const sl = live && (long ? p.l <= L.stop_loss : p.h >= L.stop_loss), tp = live && (long ? p.h >= L.take_profit : p.l <= L.take_profit);
    const color = sl ? "var(--bad)" : tp ? "var(--good)" : "var(--ink-3)";
    return `<line x1="${X(xs[i]).toFixed(1)}" x2="${X(xs[i]).toFixed(1)}" y1="${Y(p.h).toFixed(1)}" y2="${Y(p.l).toFixed(1)}" stroke="${color}" stroke-width="${ww.toFixed(1)}" stroke-opacity="${sl || tp ? 0.9 : 0.45}" stroke-linecap="round"/>`;
  }).join("");
  g += `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(p.c).toFixed(1)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<text x="${P.l}" y="${H - 6}" font-size="11" fill="var(--ink-3)">${esc(dt(pts[0].t))}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--ink-3)">${esc(dt(pts[pts.length - 1].t))}</text>`;
  g += `<line id="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink-3)" style="display:none"/><circle id="xd" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2" style="display:none"/><rect id="hit" x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent"/>`;
  svg.innerHTML = g;
  const tip = $("tip"), hit = $("hit");
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let i = 0; for (let k = 1; k < xs.length; k++) if (Math.abs(X(xs[k]) - cx) < Math.abs(X(xs[i]) - cx)) i = k;
    const x = X(xs[i]), y = Y(pts[i].c);
    $("xh").setAttribute("x1", x); $("xh").setAttribute("x2", x); $("xh").style.display = ""; $("xd").setAttribute("cx", x); $("xd").setAttribute("cy", y); $("xd").style.display = "";
    tip.innerHTML = `<div class="muted">${esc(dt(pts[i].t))}</div><b class="num">${fmt(pts[i].c, 5)}</b> <span class="muted num">H ${fmt(pts[i].h, 5)} · L ${fmt(pts[i].l, 5)}</span>`;
    tip.style.display = "block"; const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(x - tw / 2, 0), r.width - tw) + "px"; tip.style.top = "0px";
  };
  const leave = () => { tip.style.display = "none"; $("xh").style.display = "none"; $("xd").style.display = "none"; };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchstart", move, {passive: true}); hit.addEventListener("touchmove", move, {passive: true});
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", leave);
}

// ------------------------------------------------------------------ boot
(async () => {
  await loadList(true);
  const id = pathId();
  if (id) select(id, false);
  else if (isDesktop() && state.items.length) {
    history.replaceState({}, "", `/history/${state.items[0].id}${qs()}`);
    select(state.items[0].id, false);
  } else select(null, false);
})();
</script>
